# Alembic 配置。**里面刻意不写 sqlalchemy.url**：连接串的唯一来源是 app.core.config
# （读 backend/.env 与环境变量）——写进 ini 就会出现"两份凭据、谁生效看运气"，而且
# ini 比 .env 更容易被误提交。env.py 自己取 URL（也支持程序化覆盖，见 run_migrations）。
[alembic]
script_location = migrations
prepend_sys_path = .
# py3.14 + alembic 1.20 起显式声明分隔符（不写会出 DeprecationWarning：legacy 按空格/逗号/冒号切）
path_separator = os
# 版本文件名：0001_baseline 这种序号+说明（时间戳名看历史时认不出哪条是哪条）
file_template = %%(rev)s_%%(slug)s
# 类型变更也纳入 autogenerate 比较（默认只比表/列的存在性，改列宽会被漏掉）
compare_type = true
# autogenerate 后不自动加 "include_object" 之类的魔法，保持生成物可读可改

# ---- 日志：alembic 自己的输出，与应用日志（logging.getLogger("umax")）互不干扰 ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
